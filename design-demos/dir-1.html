<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向一 · 工具台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* 方向一 · Linear 式工具台
   色彩：中性灰阶（oklch L 0.13→0.98）+ 一个琥珀色。琥珀取自荧光笔和考试计时器——
   这个工具里唯一需要"被看见"的两样东西就是你划的重点和剩下的时间。 */
:root {
  --bg: #fbfbfc; --panel: #f3f3f5; --raise: #ffffff; --line: #e4e4e8; --line-2: #d4d4da;
  --ink: #16171a; --ink-2: #3c3d43; --muted: #6c6d74; --faint: #9a9ba2;
  --amber: #a8640a; --amber-bg: #fdf0d8; --mark: #ffe39a;
  --ok: #1f7a4a; --ok-bg: #e3f4ea; --bad: #b4312a; --bad-bg: #fbe7e5;
  --shadow: 0 1px 2px rgba(16,17,20,.06), 0 4px 16px rgba(16,17,20,.06);
  --sans: "Geist", -apple-system, "PingFang SC", sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Source Serif 4", "Songti SC", Georgia, serif;
}
:root[data-theme="dark"] {
  --bg: #0e0f11; --panel: #141518; --raise: #1a1b1f; --line: #232428; --line-2: #2e2f34;
  --ink: #ececee; --ink-2: #c6c6cb; --muted: #8c8d94; --faint: #5f6067;
  --amber: #f0b54d; --amber-bg: #2b2213; --mark: rgba(240,181,77,.32);
  --ok: #5fcf8f; --ok-bg: #15281d; --bad: #f08079; --bad-bg: #2d1716;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0f11; --panel: #141518; --raise: #1a1b1f; --line: #232428; --line-2: #2e2f34;
  --ink: #ececee; --ink-2: #c6c6cb; --muted: #8c8d94; --faint: #5f6067;
  --amber: #f0b54d; --amber-bg: #2b2213; --mark: rgba(240,181,77,.32);
  --ok: #5fcf8f; --ok-bg: #15281d; --bad: #f08079; --bad-bg: #2d1716;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
} }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.kbd { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; background: var(--raise); }
.mono { font-family: var(--mono); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 外壳：左栏 + 内容 */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-weight: 600; font-size: 14px; }
.brand i { width: 20px; height: 20px; border-radius: 5px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 11px var(--mono); font-style: normal; }
.nav { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 7px; color: var(--ink-2); font-size: 14px; text-decoration: none; }
.nav:hover { background: var(--line); }
.nav.on { background: var(--raise); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }
.nav .n { margin-left: auto; font: 500 11px var(--mono); background: var(--amber-bg); color: var(--amber); border-radius: 999px; padding: 1px 7px; }
.side .search { margin-top: auto; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 7px; color: var(--muted); font-size: 13px; background: var(--raise); }
.side .search .kbd { margin-left: auto; }
.content { min-width: 0; }
.page { max-width: 920px; margin: 0 auto; padding: 36px 40px 80px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 26px; }
.page-head h1 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin-left: auto; }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 6px; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--raise); color: var(--ink); box-shadow: var(--shadow); font-weight: 500; }

/* 题库：书 → Test → 三篇 */
.book { margin-bottom: 34px; }
.book h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
.book h2 span { font: 500 12px var(--mono); color: var(--muted); }
.test { border: 1px solid var(--line); border-radius: 10px; background: var(--raise); margin-bottom: 10px; overflow: hidden; }
.test-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.test-h .bar { flex: 0 0 120px; height: 4px; border-radius: 2px; background: var(--line); margin-left: auto; overflow: hidden; }
.test-h .bar i { display: block; height: 100%; background: var(--ink); }
.test-h .pct { font: 500 12px var(--mono); color: var(--muted); width: 54px; text-align: right; }
.row { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--panel); }
.row .id { font: 500 12px var(--mono); color: var(--muted); width: 22px; }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 999px; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.mid { background: var(--amber-bg); color: var(--amber); } .chip.no { color: var(--faint); }
.row .go { color: var(--faint); opacity: 0; } .row:hover .go { opacity: 1; }

/* 做题页：没有左栏、没有导航，只有一条工具条 */
.practice { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
.pbar { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.back { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raise); font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
.back:hover { border-color: var(--ink); }
.back svg.i { width: 18px; height: 18px; stroke-width: 2; }
.crumb { font: 13px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--ink); font-weight: 500; font-family: var(--sans); }
.tools { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); margin-left: auto; }
.tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 13px; }
.tool.on { background: var(--raise); color: var(--ink); box-shadow: var(--shadow); }
.tool .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--mark); outline: 1px solid var(--line-2); }
.timer { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--amber); font: 500 14px var(--mono); }
.primary { height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14px; }
.split { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 0; }
.pane { overflow-y: auto; min-height: 0; }
.passage { padding: 32px 44px 80px; border-right: 1px solid var(--line); }
.passage .inner { max-width: 640px; margin: 0 auto; }
.passage h1 { font: 600 30px/1.2 var(--serif); letter-spacing: -.01em; margin: 0 0 10px; }
.passage .sub { font: italic 17px/1.6 var(--serif); color: var(--muted); margin: 0 0 22px; }
.passage p { font: 18px/1.75 var(--serif); margin: 0 0 18px; color: var(--ink); }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.qs { padding: 22px 28px 80px; }
.qhead { display: flex; justify-content: space-between; font: 500 12px var(--mono); color: var(--muted); margin-bottom: 14px; }
.group h3 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.group .ins { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.group .ins b { color: var(--ink-2); }
.q { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.6; }
.q .qid { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; height: 22px; min-width: 32px; display: grid; place-items: center; margin-top: 1px; }
.blank { width: 130px; height: 30px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--raise); font: 14px var(--sans); color: var(--ink); padding: 0 8px; vertical-align: middle; margin: 0 2px; }
.blank::placeholder { font-family: var(--mono); color: var(--faint); text-align: center; }
.tf { display: flex; gap: 6px; margin-top: 8px; }
.tf button { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--raise); font: 500 12px var(--mono); color: var(--ink-2); }
.tf button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 短语：列表，上次学的单元高亮 + 自动滚到它 */
.resume { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); margin-bottom: 28px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); }
.resume .big { font: 600 22px var(--mono); width: 44px; height: 44px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.resume .lbl { font-size: 12px; color: var(--muted); } .resume .ttl { font-weight: 600; font-size: 16px; }
.resume .cta { margin-left: auto; }
.ugroup { margin-bottom: 22px; }
.ugroup h4 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 6px; padding-left: 14px; }
.ulist { border: 1px solid var(--line); border-radius: 10px; background: var(--raise); overflow: hidden; }
.urow { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 14px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); position: relative; }
.urow:last-child { border-bottom: 0; }
.urow:hover { background: var(--panel); }
.urow .num { font: 500 12px var(--mono); color: var(--muted); width: 24px; }
.urow .done { margin-left: auto; color: var(--ok); }
.urow.last { background: var(--amber-bg); }
.urow.last::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--amber); }
.urow.last .tag { margin-left: auto; font: 500 11px var(--mono); color: var(--amber); }

/* 单元页：大号上一 / 下一单元 */
.unit-top { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.unit-h { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.unit-h .no { font: 500 15px var(--mono); color: var(--muted); }
.unit-h h1 { margin: 0; font-size: 34px; letter-spacing: -.02em; }
.phr { display: grid; grid-template-columns: 170px 1fr; gap: 4px 18px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.phr b { font: 600 16px var(--serif); } .phr .zh { font-size: 14px; } .phr .en { grid-column: 2; color: var(--muted); font-size: 13px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
.pager a:hover { border-color: var(--ink); }
.pager .dir { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.pager .nm { font-size: 17px; font-weight: 600; }
.pager a.next { text-align: right; align-items: flex-end; }

/* 演示切换（只在这份稿子里） */
.demo { position: fixed; right: 14px; bottom: 14px; z-index: 50; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 12px; }
.demo button { border: 0; background: none; padding: 5px 9px; border-radius: 6px; color: var(--muted); }
.demo button.on { background: var(--ink); color: var(--bg); }
[hidden] { display: none !important; }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; bottom: 0; top: auto; height: auto; width: 100%; flex-direction: row; z-index: 20; padding: 6px; border-right: 0; border-top: 1px solid var(--line); justify-content: space-around; }
  .side .brand, .side .search { display: none; }
  .nav { flex-direction: column; height: 50px; gap: 2px; font-size: 11px; padding: 6px 10px; }
  .nav .n { position: absolute; margin: -4px 0 0 18px; }
  .page { padding: 22px 16px 100px; }
  .practice { grid-template-rows: auto 1fr; }
  .pbar { flex-wrap: wrap; height: auto; padding: 8px 10px; gap: 8px; }
  .crumb { display: none; }
  .tools { order: 3; margin: 0; width: 100%; justify-content: space-between; }
  .tool span { display: none; }
  .split { grid-template-columns: 1fr; overflow-y: auto; }
  .passage { padding: 20px 18px; border-right: 0; border-bottom: 1px solid var(--line); }
  .passage p { font-size: 17px; }
  .qs { padding: 18px 16px 120px; }
  .phr { grid-template-columns: 1fr; } .phr .en { grid-column: 1; }
  .demo { bottom: 74px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="demo">
  <button data-s="library">题库</button><button data-s="practice">做题</button><button data-s="units">短语</button><button data-s="unit">单元页</button>
  <span style="width:1px;background:var(--line);margin:2px 4px"></span>
  <button data-t="light">浅</button><button data-t="dark">深</button>
</div>
<script src="demo-data.js"></script>
<script>
const D = window.DEMO;
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  next: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  book: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM13 4h5.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H13z"/></svg>',
  layers: '<svg class="i" viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4zM4 12l8 4 8-4M4 16l8 4 8-4"/></svg>',
  bookmark: '<svg class="i" viewBox="0 0 24 24"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg>',
  repeat: '<svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6L4 15M4 20v-5h5"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
  cursor: '<svg class="i" viewBox="0 0 24 24"><path d="M6 4l12 7-5.5 1.5L15 18l-2.5 1.5-2.5-5.5L6 17z"/></svg>',
  pen: '<svg class="i" viewBox="0 0 24 24"><path d="M5 19l1-4 9.5-9.5a2 2 0 0 1 3 3L9 18z"/></svg>',
  marker: '<svg class="i" viewBox="0 0 24 24"><path d="M9 15l-3 3h4l1-1M9 15l8-9a2 2 0 0 1 3 3l-9 8z"/></svg>',
  eraser: '<svg class="i" viewBox="0 0 24 24"><path d="M8 20h11M5.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 19H8.5z"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};
const scores = { "剑18-1-0": "11/13", "剑18-1-1": "9/13", "剑18-2-0": "12/13" };

function shell(active, inner) {
  const nav = (k, ic, t, n) => `<a class="nav ${active === k ? "on" : ""}" href="#${k}">${I[ic]}${t}${n ? `<span class="n">${n}</span>` : ""}</a>`;
  return `<div class="shell"><aside class="side">
    <div class="brand"><i>E</i>英语学习</div>
    ${nav("library", "book", "题库")}${nav("units", "layers", "短语")}${nav("vocab", "bookmark", "生词本", 0)}${nav("review", "repeat", "复习", 12)}
    <div class="search">${I.search}搜索单词、短语<span class="kbd">⌘K</span></div>
  </aside><main class="content">${inner}</main></div>`;
}

const screens = {
  library() {
    return shell("library", `<div class="page">
      <div class="page-head"><div><h1>题库</h1><p>剑桥雅思阅读 · 点任意一篇开始</p></div>
        <div class="seg"><button class="on">A 类</button><button>G 类</button><button>全部</button></div></div>
      ${D.books.map((b) => `<section class="book"><h2>${b.title}<span>${b.type === "A" ? "Academic" : "General"}</span></h2>
        ${b.tests.map((t, ti) => {
          const done = t.filter((_, pi) => scores[`${b.short}-${ti + 1}-${pi}`]).length;
          return `<div class="test"><div class="test-h">Test ${ti + 1}<span class="bar"><i style="width:${done / 3 * 100}%"></i></span><span class="pct">${done}/3 篇</span></div>
          ${t.map((title, pi) => { const s = scores[`${b.short}-${ti + 1}-${pi}`];
            const cls = !s ? "no" : parseInt(s) / 13 >= .8 ? "ok" : "mid";
            return `<a class="row" href="#practice"><span class="id">P${pi + 1}</span><span class="t">${title}</span><span class="chip ${cls}">${s || "未做"}</span><span class="go">${I.next}</span></a>`; }).join("")}</div>`;
        }).join("")}</section>`).join("")}
    </div>`);
  },
  practice() {
    const [p1, p2, p3] = D.passage.paras;
    return `<div class="practice">
      <header class="pbar">
        <a class="back" href="#library">${I.back}题库<span class="kbd">Esc</span></a>
        <span class="crumb">剑18 / Test 1 / <b>Passage 1 · ${D.passage.title}</b></span>
        <div class="tools">
          <button class="tool on">${I.cursor}<span>鼠标</span></button><button class="tool">${I.pen}<span>学习笔</span></button>
          <button class="tool">${I.marker}<span>记号笔</span><i class="sw"></i></button><button class="tool">${I.eraser}<span>橡皮擦</span></button>
        </div>
        <span class="timer">${I.clock}17:42</span>
        <button class="primary">提交</button>
      </header>
      <div class="split">
        <section class="pane passage"><div class="inner">
          <h1>${D.passage.title}</h1><p class="sub">${D.passage.sub}</p>
          <p>${p1.replace("Strawberries that are small, intensely flavoured and resplendently red", "<mark>Strawberries that are small, intensely flavoured and resplendently red</mark>")}</p><p>${p2}</p><p>${p3}</p>
        </div></section>
        <section class="pane qs">
          <div class="qhead"><span>已答 2 / 13</span><span>Q1–13</span></div>
          <div class="group"><h3>Questions 1–3</h3><p class="ins">Complete the sentences. Choose <b>NO MORE THAN TWO WORDS AND/OR A NUMBER</b> from the passage.</p>
            <div class="q"><span class="qid">Q1</span><div>Vertical tubes are used to grow strawberries, <input class="blank" value="lettuces"> and herbs.</div></div>
            <div class="q"><span class="qid">Q2</span><div>There will eventually be a daily harvest of as much as <input class="blank" placeholder="2"> in weight of fruit and vegetables.</div></div>
            <div class="q"><span class="qid">Q3</span><div>It may be possible that the farm's produce will account for as much as 10% of the city's <input class="blank" placeholder="3"> overall.</div></div>
          </div>
          <div class="group" style="margin-top:26px"><h3>Questions 8–13</h3><p class="ins">Do the following statements agree with the information given in Reading Passage 1?</p>
            ${["Urban farming can take place above or below ground.", "Some of the equipment used in aeroponic farming can be made by hand.", "Urban farming relies more on electricity than some other types of farming."].map((s, i) =>
              `<div class="q"><span class="qid">Q${8 + i}</span><div>${s}<div class="tf"><button class="${i === 0 ? "on" : ""}">TRUE</button><button>FALSE</button><button>NOT GIVEN</button></div></div></div>`).join("")}
          </div>
        </section>
      </div></div>`;
  },
  units() {
    const groups = [];
    for (const u of D.units) { if (!groups.length || groups.at(-1).g !== u[2]) groups.push({ g: u[2], us: [] }); groups.at(-1).us.push(u); }
    return shell("units", `<div class="page">
      <div class="page-head"><div><h1>短语</h1><p>English Phrasal Verbs in Use · 已学 7 / 70</p></div></div>
      <a class="resume" href="#unit"><span class="big">08</span><div><div class="lbl">上次学到</div><div class="ttl">Unit 8 · Go</div></div><span class="cta back" style="box-shadow:none">继续学习${I.next}</span></a>
      ${groups.map((g) => `<div class="ugroup"><h4>${g.g}</h4><div class="ulist">${g.us.map(([n, t]) =>
        `<a class="urow ${n === 8 ? "last" : ""}" href="#unit" ${n === 8 ? 'id="last"' : ""}><span class="num">${String(n).padStart(2, "0")}</span>${t}${n === 8 ? '<span class="tag">上次学到这里</span>' : n < 8 ? `<span class="done">${I.check}</span>` : ""}</a>`).join("")}</div></div>`).join("")}
    </div>`);
  },
  unit() {
    return shell("units", `<div class="page">
      <div class="unit-top"><a class="back" href="#units">${I.back}全部单元<span class="kbd">Esc</span></a><span class="seg" style="margin-left:auto"><button class="on">本单元短语</button><button>讲解和练习</button><button>练习答案</button></span></div>
      <div class="unit-h"><span class="no">UNIT 08 · Key verbs</span><h1>Go</h1></div>
      <div class="ulist">${D.unit8.phrases.map(([k, en, zh]) => `<div class="phr"><b>${k}</b><span class="zh">${zh}</span><span class="en">${en}</span></div>`).join("")}</div>
      <nav class="pager">
        <a href="#unit"><span class="dir">${I.back}上一单元 <span class="kbd">K</span></span><span class="nm">07 · Get</span></a>
        <a class="next" href="#unit"><span class="dir">下一单元 <span class="kbd">J</span>${I.next}</span><span class="nm">09 · Look</span></a>
      </nav>
    </div>`);
  },
  vocab() { return screens.library(); }, review() { return screens.library(); },
};

function render() {
  const s = location.hash.slice(1) || "library";
  document.getElementById("app").innerHTML = (screens[s] || screens.library)();
  document.querySelectorAll(".demo [data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
  window.scrollTo(0, 0);
  if (s === "units") document.getElementById("last")?.scrollIntoView({ block: "center" });
}
document.querySelector(".demo").onclick = (e) => {
  const s = e.target.dataset.s, t = e.target.dataset.t;
  if (s) location.hash = s;
  if (t) { document.documentElement.dataset.theme = t; document.querySelectorAll(".demo [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t)); }
};
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
