<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向三 · 黑白网格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 方向三 · Swiss 黑白
   只有黑、白、灰阶；唯一的颜色是记号笔的荧光黄（以及判分的对/错）。
   直角、发丝线、严格网格；大小靠字号，不靠颜色。深色模式直接反相。 */
:root {
  --bg: #ffffff; --ink: #0a0a0a; --g1: #f2f2f2; --g2: #d9d9d9; --g3: #8a8a8a; --g4: #555;
  --mark: #fff176; --ok: #0a7d3c; --bad: #c4231c;
  --sans: "Geist", -apple-system, "PingFang SC", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", monospace;
}
:root[data-theme="dark"] { --bg: #0a0a0a; --ink: #f5f5f5; --g1: #171717; --g2: #2c2c2c; --g3: #8f8f8f; --g4: #b5b5b5; --mark: rgba(255,241,118,.32); --ok: #4ade80; --bad: #ff6b60; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a0a0a; --ink: #f5f5f5; --g1: #171717; --g2: #2c2c2c; --g3: #8f8f8f; --g4: #b5b5b5; --mark: rgba(255,241,118,.32); --ok: #4ade80; --bad: #ff6b60; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
a { color: inherit; text-decoration: none; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; flex: none; }
.mono { font-family: var(--mono); }

/* 顶栏：一条黑色横条（做题页、单元页不出现） */
.strip { display: flex; align-items: stretch; height: 52px; background: var(--ink); color: var(--bg); }
.strip .logo { display: flex; align-items: center; padding: 0 24px; font-weight: 800; letter-spacing: -.02em; font-size: 17px; border-right: 1px solid color-mix(in srgb, var(--bg) 25%, transparent); }
.strip a.t { display: flex; align-items: center; gap: 8px; padding: 0 22px; font-weight: 500; color: color-mix(in srgb, var(--bg) 65%, transparent); border-right: 1px solid color-mix(in srgb, var(--bg) 25%, transparent); }
.strip a.t:hover { color: var(--bg); }
.strip a.t.on { background: var(--bg); color: var(--ink); font-weight: 700; }
.strip a.t .n { font: 600 12px var(--mono); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px 80px; }
.hero { display: grid; grid-template-columns: 1fr auto; align-items: end; padding: 48px 0 20px; border-bottom: 2px solid var(--ink); }
.hero h1 { font: 800 76px/0.95 var(--sans); letter-spacing: -.045em; margin: 0; }
.hero .meta { font: 500 13px/1.6 var(--mono); text-align: right; color: var(--g4); }

/* 题库：一张严格的表 */
.bookbar { display: flex; border-bottom: 1px solid var(--g2); }
.bookbar button { height: 48px; padding: 0 22px; border: 0; border-right: 1px solid var(--g2); background: none; font-weight: 600; }
.bookbar button.on { background: var(--ink); color: var(--bg); }
table.grid { width: 100%; border-collapse: collapse; }
.grid th { text-align: left; font: 500 12px var(--mono); color: var(--g3); text-transform: uppercase; letter-spacing: .04em; padding: 12px 14px; border-bottom: 1px solid var(--g2); }
.grid td { padding: 0 14px; height: 60px; border-bottom: 1px solid var(--g2); }
.grid tr.test td { height: auto; padding-top: 30px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); font: 700 22px var(--sans); letter-spacing: -.02em; }
.grid tr.test td .mono { font-size: 13px; font-weight: 500; color: var(--g3); letter-spacing: 0; }
.grid tr.p:hover td { background: var(--g1); }
.grid .pn { font: 600 14px var(--mono); width: 70px; }
.grid .pt { font-size: 17px; font-weight: 500; }
.grid .sc { font: 600 15px var(--mono); text-align: right; width: 120px; }
.grid .sc.no { color: var(--g3); font-weight: 400; }
.grid .go { width: 60px; text-align: right; }
.bar { display: inline-block; width: 120px; height: 6px; background: var(--g2); vertical-align: middle; margin-left: 14px; }
.bar i { display: block; height: 100%; background: var(--ink); }

/* 做题页：左侧一整块黑色「返回」 */
.pr { display: grid; grid-template-columns: 76px 1fr; height: 100vh; }
.backcol { background: var(--ink); color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding-top: 22px; font-weight: 700; }
.backcol:hover { background: var(--g4); }
.backcol svg.i { width: 30px; height: 30px; stroke-width: 2.2; }
.backcol .v { writing-mode: vertical-rl; letter-spacing: .3em; font-size: 15px; }
.backcol .k { font: 500 11px var(--mono); opacity: .6; margin-top: auto; padding-bottom: 18px; }
.pr-main { display: grid; grid-template-rows: 60px 1fr; min-width: 0; }
.pr-bar { display: flex; align-items: stretch; border-bottom: 2px solid var(--ink); }
.pr-bar .crumb { display: flex; align-items: center; padding: 0 22px; font: 500 13px var(--mono); color: var(--g4); border-right: 1px solid var(--g2); }
.tools { display: flex; }
.tools button { display: flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; border-right: 1px solid var(--g2); background: none; font-weight: 600; font-size: 14px; }
.tools button.on { background: var(--ink); color: var(--bg); }
.tools .sw { width: 12px; height: 12px; background: #fff176; outline: 1px solid var(--ink); }
.pr-bar .sp { flex: 1; }
.pr-bar .timer { display: flex; align-items: center; gap: 8px; padding: 0 22px; border: 0; border-left: 1px solid var(--g2); background: none; font: 600 22px var(--mono); letter-spacing: -.02em; }
.pr-bar .submit { padding: 0 34px; border: 0; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 16px; }
.pr-cols { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
.pr-cols > * { overflow-y: auto; }
.passage { padding: 40px 48px; border-right: 2px solid var(--ink); }
.passage h1 { font: 800 52px/0.98 var(--sans); letter-spacing: -.04em; margin: 0 0 16px; }
.passage .sub { font-size: 17px; color: var(--g4); margin: 0 0 28px; padding-bottom: 22px; border-bottom: 1px solid var(--g2); }
.passage p { font-size: 17.5px; line-height: 1.72; margin: 0 0 18px; max-width: 64ch; }
.passage .pl { font: 600 12px var(--mono); color: var(--g3); float: left; margin-left: -30px; margin-top: 5px; }
mark { background: var(--mark); color: inherit; }
.qs { padding: 0; }
.qg { border-bottom: 2px solid var(--ink); }
.qg h3 { margin: 0; padding: 18px 28px 6px; font: 700 13px var(--mono); text-transform: uppercase; letter-spacing: .04em; }
.qg .ins { margin: 0; padding: 0 28px 16px; color: var(--g4); font-size: 14px; }
.q { display: grid; grid-template-columns: 64px 1fr; border-top: 1px solid var(--g2); }
.q .n { font: 700 28px/1 var(--mono); padding: 18px 0 0 28px; letter-spacing: -.04em; }
.q .b { padding: 18px 28px 18px 0; font-size: 15.5px; line-height: 1.6; }
.blank { width: 140px; height: 32px; border: 0; border-bottom: 2px solid var(--ink); background: var(--g1); padding: 0 8px; font: 600 15px var(--mono); color: var(--ink); vertical-align: middle; }
.blank:focus { outline: 0; background: var(--mark); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; border: 1px solid var(--ink); }
.opts button { height: 38px; border: 0; border-right: 1px solid var(--ink); background: none; font: 600 12px var(--mono); letter-spacing: .04em; }
.opts button:last-child { border-right: 0; }
.opts button.on { background: var(--ink); color: var(--bg); }

/* 短语：70 格网格，上次学的反相 */
.resume { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; padding: 26px 0; border-bottom: 1px solid var(--g2); }
.resume .num { font: 800 92px/0.8 var(--sans); letter-spacing: -.06em; }
.resume .l { font: 500 13px var(--mono); color: var(--g3); } .resume .t { font: 700 32px var(--sans); letter-spacing: -.03em; }
.resume .go { height: 64px; padding: 0 32px; background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; }
.legend { display: flex; gap: 22px; padding: 16px 0; font: 500 12px var(--mono); color: var(--g3); }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--ink); vertical-align: -2px; margin-right: 6px; }
.legend i.d { background: var(--g2); border-color: var(--g2); } .legend i.l { background: var(--ink); }
.ugrid { display: grid; grid-template-columns: repeat(10, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
.cell { aspect-ratio: 1 / .78; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.cell:hover { background: var(--g1); }
.cell .cn { font: 700 24px/1 var(--mono); letter-spacing: -.04em; }
.cell .ct { font-size: 13px; font-weight: 500; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cell.done { color: var(--g3); } .cell.done .cn::after { content: " ✓"; font-size: 14px; }
.cell.last { background: var(--ink); color: var(--bg); position: relative; }
.cell.last::before { content: "上次"; position: absolute; top: 10px; right: 10px; font: 600 11px var(--mono); }
.gsep { grid-column: 1 / -1; padding: 10px 12px; font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .04em; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--g1); }

/* 单元页 */
.u-head { display: grid; grid-template-columns: 76px 1fr auto; border-bottom: 2px solid var(--ink); }
.u-head .backcol { padding: 0; justify-content: center; flex-direction: row; gap: 0; }
.u-head .title { padding: 26px 32px 18px; }
.u-head .title .k { font: 500 13px var(--mono); color: var(--g3); }
.u-head .title h1 { margin: 4px 0 0; font: 800 88px/0.9 var(--sans); letter-spacing: -.05em; }
.u-head .title h1 span { color: var(--g3); font-weight: 400; }
.u-head .seg { display: flex; align-self: end; }
.u-head .seg button { height: 52px; padding: 0 22px; border: 0; border-left: 1px solid var(--g2); background: none; font-weight: 600; }
.u-head .seg button.on { background: var(--ink); color: var(--bg); }
.phl { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
.ph { display: grid; grid-template-columns: 280px 260px 1fr; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--g2); align-items: baseline; }
.ph b { font-size: 20px; font-weight: 700; letter-spacing: -.02em; } .ph .zh { font-weight: 600; font-size: 16px; } .ph .en { color: var(--g4); font-size: 14.5px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--ink); margin-top: 48px; }
.pager a { display: flex; align-items: center; gap: 22px; padding: 30px 32px; min-height: 140px; }
.pager a:first-child { border-right: 2px solid var(--ink); }
.pager a:hover { background: var(--g1); }
.pager a.next { justify-content: flex-end; text-align: right; background: var(--ink); color: var(--bg); }
.pager a.next:hover { background: var(--g4); }
.pager svg.i { width: 40px; height: 40px; stroke-width: 2; }
.pager .k { font: 500 13px var(--mono); opacity: .65; } .pager .t { font: 800 44px/1 var(--sans); letter-spacing: -.04em; margin-top: 6px; }
.pager .t .mono { font-weight: 500; font-size: 26px; opacity: .6; margin-right: 10px; }

.demo { position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; border: 1px solid var(--ink); background: var(--bg); font: 500 11px var(--mono); }
.demo button { border: 0; background: none; padding: 6px 10px; } .demo button.on { background: var(--ink); color: var(--bg); }

@media (max-width: 820px) {
  .strip { overflow-x: auto; } .strip .logo { display: none; } .strip a.t { padding: 0 16px; white-space: nowrap; }
  .wrap { padding: 0 16px 80px; }
  .hero { grid-template-columns: 1fr; padding-top: 28px; } .hero h1 { font-size: 48px; } .hero .meta { text-align: left; margin-top: 10px; }
  .bookbar { overflow-x: auto; } .bookbar button { white-space: nowrap; padding: 0 16px; }
  .grid th:nth-child(3), .grid td.go, .grid th.go { display: none; } .bar { display: none; }
  .grid .pt { font-size: 15px; } .grid .sc { width: auto; }
  .pr { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
  .backcol { flex-direction: row; justify-content: flex-start; padding: 0 16px; height: 56px; gap: 10px; }
  .backcol .v { writing-mode: horizontal-tb; letter-spacing: 0; } .backcol .k { display: none; }
  .pr-main { grid-template-rows: auto auto; }
  .pr-bar { flex-wrap: wrap; } .pr-bar .crumb { display: none; }
  .tools { width: 100%; border-bottom: 1px solid var(--g2); } .tools button { flex: 1; justify-content: center; padding: 12px 0; } .tools button span { display: none; }
  .pr-bar .timer { border-left: 0; padding: 12px 16px; font-size: 18px; } .pr-bar .submit { padding: 0 24px; }
  .pr-cols { grid-template-columns: 1fr; } .passage { border-right: 0; border-bottom: 2px solid var(--ink); padding: 24px 16px 24px 34px; } .passage h1 { font-size: 36px; }
  .q { grid-template-columns: 48px 1fr; } .q .n { padding-left: 16px; font-size: 22px; } .q .b { padding-right: 16px; } .qg h3, .qg .ins { padding-left: 16px; padding-right: 16px; }
  .resume { grid-template-columns: auto 1fr; } .resume .num { font-size: 64px; } .resume .go { grid-column: 1 / -1; justify-content: center; }
  .ugrid { grid-template-columns: repeat(4, 1fr); } .cell .cn { font-size: 18px; }
  .u-head { grid-template-columns: 1fr; } .u-head .backcol { height: 56px; justify-content: flex-start; padding: 0 16px; gap: 10px; }
  .u-head .title { padding: 18px 16px 12px; } .u-head .title h1 { font-size: 60px; }
  .u-head .seg { overflow-x: auto; } .u-head .seg button { white-space: nowrap; border-left: 0; border-right: 1px solid var(--g2); }
  .phl { padding: 0 16px; } .ph { grid-template-columns: 1fr; gap: 2px; }
  .pager a { padding: 20px 16px; min-height: 110px; gap: 10px; } .pager .t { font-size: 28px; } .pager .t .mono { display: block; font-size: 15px; margin: 0; } .pager svg.i { width: 28px; height: 28px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="demo">
  <button data-s="library">题库</button><button data-s="practice">做题</button><button data-s="units">短语</button><button data-s="unit">单元页</button>
  <button data-t="light">浅</button><button data-t="dark">深</button>
</div>
<script src="demo-data.js"></script>
<script>
const D = window.DEMO;
const I = {
  back: '<svg class="i" viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>',
  next: '<svg class="i" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>',
  cursor: '<svg class="i" viewBox="0 0 24 24"><path d="M6 4l12 7-5.5 1.5L15 18l-2.5 1.5-2.5-5.5L6 17z"/></svg>',
  pen: '<svg class="i" viewBox="0 0 24 24"><path d="M5 19l1-4 9.5-9.5 3 3L9 18z"/></svg>',
  marker: '<svg class="i" viewBox="0 0 24 24"><path d="M9 15l-3 3h4l1-1M9 15l8-9 3 3-9 8z"/></svg>',
  eraser: '<svg class="i" viewBox="0 0 24 24"><path d="M8 20h11M5 15l9-9 5 5-8 8H8z"/></svg>',
};
const scores = { "剑18-1-0": "11/13", "剑18-1-1": "9/13", "剑18-2-0": "12/13" };
function strip(on) {
  const t = (k, label, n) => `<a class="t ${on === k ? "on" : ""}" href="#${k}">${label}${n ? `<span class="n">${n}</span>` : ""}</a>`;
  return `<nav class="strip"><span class="logo">英语学习</span>${t("library", "题库")}${t("units", "短语")}${t("vocab", "生词本")}${t("review", "复习", 12)}</nav>`;
}
const screens = {
  library() {
    const b = D.books[0];
    return strip("library") + `<div class="wrap"><div class="hero"><h1>题库</h1><div class="meta">剑桥雅思阅读 · A 类<br>24 篇 · 已做 3 · 平均 10.7/13</div></div>
      <div class="bookbar">${D.books.map((x, i) => `<button class="${i === 0 ? "on" : ""}">${x.short}</button>`).join("")}<button>剑11G</button><button>剑13G</button></div>
      <table class="grid"><thead><tr><th>Passage</th><th>标题</th><th class="go"></th><th style="text-align:right">得分</th></tr></thead><tbody>
      ${b.tests.map((t, ti) => {
        const done = t.filter((_, pi) => scores[`${b.short}-${ti + 1}-${pi}`]).length;
        return `<tr class="test"><td colspan="4">Test ${ti + 1} <span class="bar"><i style="width:${done / 3 * 100}%"></i></span> <span class="mono">${done}/3</span></td></tr>` +
          t.map((title, pi) => { const s = scores[`${b.short}-${ti + 1}-${pi}`];
            return `<tr class="p" onclick="location.hash='practice'"><td class="pn">P${pi + 1}</td><td class="pt">${title}</td><td class="go">${I.next}</td><td class="sc ${s ? "" : "no"}">${s || "未做"}</td></tr>`; }).join(""); }).join("")}
      </tbody></table></div>`;
  },
  practice() {
    const [p1, p2, p3] = D.passage.paras;
    return `<div class="pr"><a class="backcol" href="#library" title="返回题库 (Esc)">${I.back}<span class="v">题库</span><span class="k">Esc</span></a>
      <div class="pr-main">
        <header class="pr-bar"><span class="crumb">剑18 / Test 1 / P1</span>
          <div class="tools"><button class="on">${I.cursor}<span>鼠标</span></button><button>${I.pen}<span>学习笔</span></button><button>${I.marker}<span>记号笔</span><i class="sw"></i></button><button>${I.eraser}<span>橡皮擦</span></button></div>
          <span class="sp"></span><button class="timer">17:42</button><button class="submit">提交</button></header>
        <div class="pr-cols">
          <article class="passage"><h1>${D.passage.title}</h1><p class="sub">${D.passage.sub}</p>
            <p><span class="pl">A</span>${p1.replace("Strawberries that are small, intensely flavoured and resplendently red", "<mark>Strawberries that are small, intensely flavoured and resplendently red</mark>")}</p><p><span class="pl">B</span>${p2}</p><p><span class="pl">C</span>${p3}</p></article>
          <section class="qs">
            <div class="qg"><h3>Questions 1–3</h3><p class="ins">Choose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage.</p>
              <div class="q"><span class="n">1</span><div class="b">Vertical tubes are used to grow strawberries, <input class="blank" value="lettuces"> and herbs.</div></div>
              <div class="q"><span class="n">2</span><div class="b">There will eventually be a daily harvest of as much as <input class="blank"> in weight of fruit and vegetables.</div></div></div>
            <div class="qg"><h3>Questions 8–13</h3><p class="ins">Do the following statements agree with the information given in Reading Passage 1?</p>
              ${["Urban farming can take place above or below ground.", "Some of the equipment used in aeroponic farming can be made by hand.", "Urban farming relies more on electricity than some other types of farming."].map((s, i) =>
                `<div class="q"><span class="n">${8 + i}</span><div class="b">${s}<div class="opts"><button class="${i === 0 ? "on" : ""}">TRUE</button><button>FALSE</button><button>NOT GIVEN</button></div></div></div>`).join("")}</div>
          </section>
        </div>
      </div></div>`;
  },
  units() {
    let cells = "", g = "";
    for (const [n, t, grp] of D.units) {
      if (grp !== g) { g = grp; cells += `<div class="gsep">${grp}</div>`; }
      cells += `<a class="cell ${n < 8 ? "done" : ""} ${n === 8 ? "last" : ""}" ${n === 8 ? 'id="last"' : ""} href="#unit"><span class="cn">${String(n).padStart(2, "0")}</span><span class="ct">${t}</span></a>`;
    }
    return strip("units") + `<div class="wrap"><div class="hero"><h1>短语动词</h1><div class="meta">English Phrasal Verbs in Use<br>70 单元 · 已学 7</div></div>
      <a class="resume" href="#unit"><span class="num">08</span><div><div class="l">上次学到</div><div class="t">Go</div></div><span class="go">继续学习 ${I.next}</span></a>
      <div class="legend"><span><i class="d"></i>学过</span><span><i class="l"></i>上次学到</span><span><i></i>没学</span></div>
      <div class="ugrid">${cells}</div></div>`;
  },
  unit() {
    return `<header class="u-head"><a class="backcol" href="#units" title="全部单元 (Esc)">${I.back}</a>
        <div class="title"><div class="k">Key verbs / 全部单元 → Unit 08</div><h1><span>08</span> Go</h1></div>
        <div class="seg"><button class="on">短语 10</button><button>讲解和练习</button><button>答案</button></div></header>
      <div class="phl">${D.unit8.phrases.map(([k, en, zh]) => `<div class="ph"><b>${k}</b><span class="zh">${zh}</span><span class="en">${en}</span></div>`).join("")}</div>
      <nav class="pager"><a href="#unit">${I.back}<div><div class="k">上一单元 · K</div><div class="t"><span class="mono">07</span>Get</div></div></a>
        <a class="next" href="#unit"><div><div class="k">下一单元 · J</div><div class="t"><span class="mono">09</span>Look</div></div>${I.next}</a></nav>`;
  },
  vocab() { return screens.library(); }, review() { return screens.library(); },
};
function render() {
  const s = location.hash.slice(1) || "library";
  document.getElementById("app").innerHTML = (screens[s] || screens.library)();
  document.querySelectorAll(".demo [data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
  window.scrollTo(0, 0);
}
document.querySelector(".demo").onclick = (e) => {
  const s = e.target.dataset.s, t = e.target.dataset.t;
  if (s) location.hash = s;
  if (t) { document.documentElement.dataset.theme = t; document.querySelectorAll(".demo [data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === t)); }
};
addEventListener("hashchange", render);
render();
</script>
</body>
